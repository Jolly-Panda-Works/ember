version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm-packages:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/mobile"
    schedule:
      interval: monthly
    groups:
      mobile-packages:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
