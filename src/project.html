<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="projectWin">
<header class="topbar" id="head"></header>
<section class="projInfo" id="info"></section>
<section class="logBox">
  <div class="logHead">
    <span class="logTitle" data-ico="terminal"></span><b data-i18n="proj.log"></b>
    <span class="grow"></span>
    <label class="switch small"><input type="checkbox" id="follow" checked><span data-i18n="proj.follow"></span></label>
    <button class="btn sm ghost" id="copy"><span data-ico="copy"></span><span data-i18n="proj.copy"></span></button>
    <button class="btn sm ghost" id="clear"><span data-ico="trash"></span><span data-i18n="proj.clear"></span></button>
  </div>
  <pre id="log"></pre>
</section>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="project.js"></script>
</body>
</html>
