<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="icon.svg" alt=""><b>Ember</b><span class="ver" id="ver" hidden></span></div>
  <input id="q" type="search" data-i18n-ph="search">
  <nav class="tools">
    <button id="add" class="tbtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="top.add"></span></button>
    <button id="settingsBtn" class="tbtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="top.settings"></span><span id="settingsDot" class="badgeDot" hidden data-i18n-title="top.updateDot"></span></button>
  </nav>
</header>

<div class="layout">
  <aside><div id="groups"></div></aside>
  <main>
    <div class="scroll">
      <div class="pagehead">
        <h1 id="pageTitle"></h1>
        <p id="stats"></p>
      </div>
      <div id="banners"></div>
      <section id="grid"></section>
    </div>
  </main>
</div>

<dialog id="editDlg">
  <h2 data-i18n="edit.title"></h2>
  <div class="box">
    <div class="sec" data-i18n="edit.logo"></div>
    <div class="logoEdit">
      <div class="logo big" id="eLogo"></div>
      <div>
        <div class="dlgRow">
          <button class="btn" id="eLogoPick" data-i18n="edit.pick"></button>
          <button class="btn ghost" id="eLogoAuto" data-i18n="edit.auto"></button>
          <button class="btn ghost" id="eLogoNone" data-i18n="edit.none"></button>
        </div>
        <p class="hint" id="eLogoHint"></p>
      </div>
    </div>
  </div>
  <div class="box">
    <div class="sec" data-i18n="edit.details"></div>
    <label><span data-i18n="edit.name"></span><input id="eName" maxlength="80"></label>
    <label><span data-i18n="edit.port"></span> <small class="hint" data-i18n="edit.portHint"></small><input id="ePort" type="number" min="1" max="65535" data-i18n-ph="edit.portAuto" dir="ltr"></label>
    <div id="eCats"></div>
  </div>
  <div class="dlgActions">
    <button class="btn danger" id="eRemove" data-i18n="edit.remove"></button>
    <span style="flex:1"></span>
    <button class="btn ghost" id="eCancel" data-i18n="edit.cancel"></button>
    <button class="btn primary" id="eSave" data-i18n="edit.save"></button>
  </div>
</dialog>

<dialog id="setDlg" class="settings">
  <nav id="setTabs">
    <div class="side-h" data-i18n="set.title"></div>
    <button class="nav" data-tab="general" data-i18n="set.tab.general"></button>
    <button class="nav" data-tab="cats" data-i18n="set.tab.cats"></button>
    <button class="nav" data-tab="projects" data-i18n="set.tab.projects"></button>
    <button class="nav" data-tab="updates"><span data-i18n="set.tab.updates"></span><span id="tabDot" class="badgeDot" hidden></span></button>
    <button class="nav" data-tab="ports" data-i18n="set.tab.ports"></button>
    <button class="nav" data-tab="about" data-i18n="set.tab.about"></button>
  </nav>
  <div class="pane">
    <div class="paneBody">
      <section data-pane="general">
        <h2 data-i18n="set.general"></h2>
        <div class="box">
          <div class="sec" data-i18n="set.language"></div>
          <label><span data-i18n="set.languageLabel"></span> · Language
            <select id="sLang"><option value="fa">فارسی</option><option value="en">English</option></select>
          </label>
        </div>
        <div class="box">
          <div class="sec" data-i18n="set.notifyWin"></div>
          <label class="switch"><input type="checkbox" data-set="notify"><span><span data-i18n="set.notify"></span><small data-i18n="set.notifyHint"></small></span></label>
          <label class="switch"><input type="checkbox" data-set="tray"><span><span data-i18n="set.tray"></span><small data-i18n="set.trayHint"></small></span></label>
          <label class="switch"><input type="checkbox" data-set="autostart"><span><span data-i18n="set.autostart"></span><small data-i18n="set.autostartHint"></small></span></label>
        </div>
        <div class="box">
          <div class="sec" data-i18n="set.data"></div>
          <div class="dlgRow"><button class="btn" id="sData" data-i18n="set.dataFolder"></button></div>
        </div>
      </section>

      <section data-pane="cats">
        <h2 data-i18n="set.cats"></h2>
        <p class="sub" data-i18n="set.catsSub"></p>
        <div id="catList"></div>
        <button class="btn" id="addCat" data-i18n="cat.addCat"></button>
        <div id="emojiPick" hidden></div>
      </section>

      <section data-pane="projects">
        <h2 data-i18n="set.projects"></h2>
        <p class="sub" data-i18n="set.projectsSub"></p>
        <div class="box">
          <div class="sec" data-i18n="set.check"></div>
          <label class="switch"><input type="checkbox" data-set="watchProjects"><span data-i18n="set.watch"></span></label>
          <label class="switch"><input type="checkbox" data-set="fetchRemote"><span><span data-i18n="set.fetch"></span><small data-i18n="set.fetchHint"></small></span></label>
          <label><span data-i18n="set.every"></span><select id="sFetchMin"></select></label>
          <div class="dlgRow"><button class="btn" id="sCheckProjects" data-i18n="set.checkNow"></button><span id="sProjMsg" class="hint"></span></div>
        </div>
      </section>

      <section data-pane="updates">
        <h2 data-i18n="set.updates"></h2>
        <div class="box">
          <div class="sec" data-i18n="set.version"></div>
          <div class="verRow"><span data-i18n="set.current"></span> <code id="uCur"></code></div>
          <div id="uStatus"></div>
          <div id="uProgress" class="progress" hidden><i></i></div>
          <div id="uNotes" class="notes" hidden></div>
          <div class="dlgRow">
            <button class="btn primary" id="uInstall" hidden></button>
            <button class="btn" id="uCheck" data-i18n="set.checkUpdate"></button>
            <button class="btn ghost" id="uPage" data-i18n="set.releases"></button>
          </div>
        </div>
        <p class="hint" data-i18n="set.howTo"></p>
      </section>

      <section data-pane="ports">
        <h2 data-i18n="ports.title"></h2>
        <p class="sub" data-i18n="ports.sub"></p>
        <div class="dlgRow portsBar">
          <button class="btn" id="pRefresh" data-i18n="ports.refresh"></button>
          <label class="switch small"><input type="checkbox" id="pOnly"><span data-i18n="ports.onlyProjects"></span></label>
          <span class="hint" id="pCount"></span>
        </div>
        <div id="portList" class="portList"></div>
      </section>

      <section data-pane="about">
        <h2 data-i18n="set.about"></h2>
        <div class="box">
          <div class="sec" data-i18n="set.about"></div>
          <div class="about">
            <img src="icon.svg" alt="" width="76" height="76">
            <div>
              <b class="aName">Ember <small>اخگر</small></b>
              <div class="muted"><span data-i18n="set.version"></span> <span id="aVer"></span></div>
              <div data-i18n="set.by"></div>
              <a href="#" data-link-abs="https://www.useffarahmand.com/">www.useffarahmand.com</a>
            </div>
          </div>
          <p class="muted" data-i18n="app.tagline"></p>
          <div class="dlgRow">
            <button class="btn" data-link-abs="https://www.useffarahmand.com/" data-i18n="set.website"></button>
            <button class="btn" data-link="">GitHub</button>
            <button class="btn" data-link="/releases">Releases</button>
            <button class="btn" data-link="/issues/new?template=bug_report.yml" data-i18n="set.report"></button>
          </div>
          <p class="hint" data-i18n="set.license"></p>
        </div>
      </section>
    </div>
    <div class="paneFoot"><span style="flex:1"></span><button class="btn primary" id="setClose" data-i18n="set.done"></button></div>
  </div>
</dialog>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
