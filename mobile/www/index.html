<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Remote</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#110D0A;color:#F5EEE8;font:15px Tahoma,sans-serif}
form{width:min(340px,90vw);display:grid;gap:12px}
h1{margin:0 0 6px;font-size:22px}
input{background:#2A211A;color:#F5EEE8;border:1px solid #3A2E24;border-radius:10px;padding:12px;font-size:16px;direction:ltr;text-align:left}
input:focus{outline:2px solid #F97316}
button{background:#F97316;color:#1A0E05;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:700}
p{color:#A99B8E;font-size:13px;margin:0}
</style></head><body>
<form id="f">
  <h1>🔥 Ember Remote</h1>
  <p>در برنامه‌ی ویندوز: «دسترسی از موبایل» را روشن کنید و آی‌پی و PIN را اینجا بزنید.</p>
  <input id="ip" placeholder="192.168.1.20" inputmode="decimal" required>
  <input id="port" value="7777" inputmode="numeric" required>
  <input id="pin" placeholder="PIN" inputmode="numeric" required>
  <button>اتصال</button>
</form>
<script>
const g=k=>localStorage.getItem(k)||'';
ip.value=g('ip');port.value=g('port')||'7777';pin.value=g('pin');
f.onsubmit=e=>{e.preventDefault();
  ['ip','port','pin'].forEach(k=>localStorage.setItem(k,document.getElementById(k).value.trim()));
  location.href=`http://${ip.value.trim()}:${port.value.trim()}/?pin=${encodeURIComponent(pin.value.trim())}`;};
</script></body></html>
